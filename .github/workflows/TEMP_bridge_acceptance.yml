name: temporary target bridge acceptance
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target bridge branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: hallo-netizen/affiliate-pferdeportal
          ref: bridge/text-start-receiver-20260923
          fetch-depth: 1
          persist-credentials: false
      - name: Compile changed Python
        run: |
          python3 -m py_compile control/startmaster0107/pre_codex_start_hardlock.py
          python3 -m py_compile isolated_system4/test_text_start_receiver.py
      - name: Run hard receiver tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s isolated_system4 -p 'test_text_start_receiver.py'
      - name: Parse receiver YAML
        run: ruby -e "require 'yaml'; YAML.load_file('.github/workflows/text-start-pferdeatelier.yml'); puts 'YAML_PARSE_PASS'"
