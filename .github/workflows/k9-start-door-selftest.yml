name: K9 exact start-door selftest
on:
  push:
    branches: [konzept9/isolated-start-20260929]
permissions:
  actions: write
  contents: read
jobs:
  dispatch-door:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the actual K9 start door on this branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '{"ref":"konzept9/isolated-start-20260929","inputs":{"station":"research","batch_size":"1"}}' > body.json
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/hallo-netizen/text-start/actions/workflows/text-start-door.yml/dispatches \
            -d @body.json
