name: K8 Start Switch Test
on:
  push:
    branches:
      - k8-verbot-single-target-20260928
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: python3 start.py start pferdeatelier
