name: text-start door

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  door:
    runs-on: ubuntu-latest
    env:
      TARGET_TOKEN: ${{ secrets.TEXT_START_TARGET_TOKEN }}
    steps:
      - name: Checkout fixed start door
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Run hard tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Resolve request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            project="pferdeatelier"
            issue_number=""
          else
            case "$ISSUE_TITLE" in
              "START:pferdeatelier") project="pferdeatelier" ;;
              *) echo "Unsupported start request"; exit 2 ;;
            esac
            issue_number="${{ github.event.issue.number }}"
          fi
          python3 start.py start "$project" | tee START_AUTHORIZATION.json
          python3 - <<'PY'
          import json
          data=json.load(open("START_AUTHORIZATION.json", encoding="utf-8"))
          if data.get("status") != "START_AUTHORIZED":
              raise SystemExit("START_NOT_AUTHORIZED")
          PY
          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"

      - name: Upload start authorization
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: start-authorization-${{ steps.request.outputs.project }}
          path: START_AUTHORIZATION.json
          if-no-files-found: error
          retention-days: 30

      - name: Mark issue authorized
        if: github.event_name == 'issues'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'START_AUTHORIZED: ' + '${{ steps.request.outputs.project }}' + '\nRUN_ID: ' + context.runId
            })

      - name: Mark target dispatch requested
        if: github.event_name == 'issues' && env.TARGET_TOKEN != ''
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'TARGET_DISPATCH_REQUESTED: pferdeatelier\nSOURCE_RUN_ID: ' + context.runId
            })

      - name: Dispatch fixed Pferdeatelier receiver
        if: github.event_name == 'issues' && env.TARGET_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.TARGET_TOKEN }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_ISSUE_NUMBER: ${{ steps.request.outputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          a=json.load(open("START_AUTHORIZATION.json", encoding="utf-8"))
          if a["target_repository"] != "hallo-netizen/affiliate-pferdeportal":
              raise SystemExit("TARGET_REPOSITORY_DRIFT")
          if a["target_ref"] != "main":
              raise SystemExit("TARGET_REF_DRIFT")
          if a["target_workflow"] != "text-start-pferdeatelier.yml":
              raise SystemExit("TARGET_WORKFLOW_DRIFT")
          if a["target_start_contract"] != "CURRENT_PROJECT_1_TO_N":
              raise SystemExit("TARGET_START_CONTRACT_DRIFT")
          if a["current_assignment_resolution"] != "TARGET_RECEIVER_AT_RUN_TIME":
              raise SystemExit("CURRENT_ASSIGNMENT_RESOLUTION_DRIFT")
          PY
          body="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
            "ref": "main",
            "inputs": {
              "source_run_id": os.environ["SOURCE_RUN_ID"],
              "source_issue_number": os.environ["SOURCE_ISSUE_NUMBER"]
            }
          }, separators=(",", ":")))
          PY
          )"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/hallo-netizen/affiliate-pferdeportal/actions/workflows/text-start-pferdeatelier.yml/dispatches \
            -d "$body"

      - name: Bridge status without target token
        if: github.event_name == 'issues' && env.TARGET_TOKEN == ''
        run: echo "BRIDGE_PENDING_TARGET_TOKEN"
