name: text-start door

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  door:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fixed start door
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Run hard tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Resolve request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            project="pferdeatelier"
            issue_number=""
          else
            case "$ISSUE_TITLE" in
              "START:pferdeatelier") project="pferdeatelier" ;;
              *) echo "Unsupported start request"; exit 2 ;;
            esac
            issue_number="${{ github.event.issue.number }}"
          fi
          python3 start.py start "$project" | tee START_AUTHORIZATION.json
          python3 - <<'PY'
          import json
          data=json.load(open("START_AUTHORIZATION.json", encoding="utf-8"))
          if data.get("status") != "START_AUTHORIZED":
              raise SystemExit("START_NOT_AUTHORIZED")
          PY
          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"

      - name: Verify pinned K0 entry on production repository
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, urllib.request
          repo='hallo-netizen/affiliate-pferdeportal'
          ref='konzept0-portal-neutral-20261002'
          workflow='.github/workflows/k0-authoring-context.yml'
          def get(path):
              url=f'https://api.github.com/repos/{repo}/contents/{path}?ref={ref}'
              request=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json','User-Agent':'text-start-k0-entry-verifier'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  doc=json.load(response)
              if doc.get('type')!='file' or doc.get('encoding')!='base64':
                  raise SystemExit('K0_EXPECTED_REPOSITORY_FILE_MISSING:'+path)
              return base64.b64decode(doc['content'])
          state=json.loads(get('K0_CURRENT_STATE.json'))
          if state.get('role')!='SOLE_CURRENT_AUTHORITY' or state.get('branch')!=ref:
              raise SystemExit('K0_CURRENT_AUTHORITY_DRIFT')
          binding=state.get('work_binding') or {}
          mechanism=binding.get('start_mechanism') or {}
          if (binding.get('start_command')!='K0:start'
                  or binding.get('start_ref')!='K0_START_HERE.md'
                  or mechanism.get('type')!='EXISTING_GITHUB_FILE_TRIGGER_FOR_CURRENT_UPLOAD'
                  or mechanism.get('trigger_workflow')!=workflow
                  or mechanism.get('writer_core_mode')!='UNCHANGED_SINGLE_ITEM'
                  or state.get('publish_allowed') is not False):
              raise SystemExit('K0_START_CONTRACT_DRIFT')
          entry=get('K0_START_HERE.md').decode('utf-8')
          if '`K0:start`' not in entry:
              raise SystemExit('K0_START_ENTRY_MISSING')
          wf=get(workflow).decode('utf-8')
          if ('  push:' not in wf
                  or 'branches: [konzept0-portal-neutral-20261002]' not in wf
                  or "real_runs/k0/**/AUTHORING_CONTEXT.json" not in wf):
              raise SystemExit('K0_EXISTING_TRIGGER_DRIFT')
          with open('K0_ENTRY_VERIFIED.json','w',encoding='utf-8') as output:
              json.dump({'status':'K0_ENTRY_VERIFIED','target_repository':repo,'target_ref':ref,'start_command':'K0:start','target_workflow':workflow,'requires_current_upload':True,'publish_allowed':False}, output,ensure_ascii=False,sort_keys=True)
          print('K0_ENTRY_VERIFIED; existing K0 is file-triggered, not workflow_dispatch')
          PY

      - name: Upload verified start authorization
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: start-authorization-${{ steps.request.outputs.project }}
          path: |
            START_AUTHORIZATION.json
            K0_ENTRY_VERIFIED.json
          if-no-files-found: error
          retention-days: 30

      - name: Mark issue K0 entry verified
        if: github.event_name == 'issues'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'K0_ENTRY_VERIFIED: pferdeatelier\nSOURCE_RUN_ID: ' + context.runId + '\nK0_START: konzept0-portal-neutral-20261002:K0_START_HERE.md\nNEXT: Continue current-upload research and writing within unchanged K0'
            })
