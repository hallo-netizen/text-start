name: text-start door
on:
  workflow_dispatch:
    inputs:
      station:
        description: 'Was soll heute gemacht werden?'
        required: true
        type: choice
        options: [research, write, check, repair]
      batch_size:
        description: 'Wie viele Artikel?'
        required: true
        default: '10'
permissions:
  contents: read
jobs:
  k9-door:
    runs-on: ubuntu-latest
    env:
      TARGET_TOKEN: ${{ secrets.TEXT_START_TARGET_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Assert white K9 start tree
        run: |
          test -f START_CONTRACT.json
          test ! -e projects
          test ! -e start.py
      - name: Dispatch exact K9 station only
        env:
          GH_TOKEN: ${{ env.TARGET_TOKEN }}
          STATION: ${{ inputs.station }}
          BATCH_SIZE: ${{ inputs.batch_size }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          python3 - <<'PY' > body.json
          import json, os
          print(json.dumps({"ref":"konzept9/greenfield-20260929","inputs":{"station":os.environ["STATION"],"batch_size":os.environ["BATCH_SIZE"]}},separators=(",",":")))
          PY
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/hallo-netizen/affiliate-pferdeportal/actions/workflows/text-start-pferdeatelier.yml/dispatches \
            -d @body.json
