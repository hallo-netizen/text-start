name: K9 temporary E2E trigger
on:
  push:
    branches: [konzept9/isolated-start-20260929]
    paths: ['E2E_TRIGGER.json']
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Dispatch actual K9 start door
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > body.json
          import json
          t=json.load(open('E2E_TRIGGER.json'))
          assert t['contract']=='K9_E2E_TRIGGER_V1'
          assert t['station'] in ['research','write','check','repair']
          assert 1 <= int(t['batch_size']) <= 1000
          print(json.dumps({'ref':'konzept9/isolated-start-20260929','inputs':{'station':t['station'],'batch_size':str(t['batch_size'])}},separators=(',',':')))
          PY
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/hallo-netizen/text-start/actions/workflows/text-start-door.yml/dispatches \
            -d @body.json
